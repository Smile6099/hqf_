      --accent: #0ea5e9;
      --bg: #ffffff;
      --bg-alt: #f0fdf4;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-light: #4b5563;
      --border: #e5e7eb;
      --shadow: rgba(22,163,74,0.12);
      --transition: 200ms ease;
    }
    [data-theme="dark"] {
      --primary: #22c55e;
      --primary-light: #4ade80;
      --primary-dark: #16a34a;
      --accent: #38bdf8;
      --bg: #111827;
      --bg-alt: #0f2016;
      --card-bg: #1f2937;
      --text: #f3f4f6;
      --text-light: #d1d5db;
      --border: #374151;
      --shadow: rgba(34,197,94,0.15);
    }
    * { margin:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      html {scroll-behavior:auto;}
      * {animation:none !important;transition:none !important;}
    }
    body {
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;

    }
    .container { max-width:1100px; margin:0 auto; padding:0 1rem; }
    header.nav-bar {
      position:sticky; top:0; z-index:50;
      background:var(--card-bg); border-bottom:1px solid var(--border);
      box-shadow:0 2px 8px var(--shadow);
    }
    .nav-inner { display:flex; justify-content:space-between; align-items:center; padding:0.75rem 1rem; }
    .nav-brand-wrap { display:flex; flex-direction:column; }
    .nav-puzzle-slogan { font-size:0.72rem; color:var(--primary); opacity:0.85; }
    .nav-brand { font-weight:700; font-size:1.25rem; color:#000; }
    [data-theme="dark"] .nav-brand { color:#fff; }
    .nav-links { display:flex; gap:1.25rem; align-items:center; }
    .nav-links a { color:var(--text); text-decoration:none; font-size:0.9rem; transition:var(--transition); }
    .nav-links a:hover { color:var(--primary); }
    button {
      font:inherit; cursor:pointer; border:none; border-radius:8px;
      padding:0.5rem 0.8rem; transition:var(--transition);
    }
    .btn-primary { background:var(--primary); color:white; }
    .btn-primary:hover { background:var(--primary-dark); }
    .btn-ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
    .btn-ghost:hover { border-color:var(--primary); color:var(--primary); }

    /* ===== Hero：拼图背景纹理 + 圆形头像 ===== */
    .hero {
      padding:4rem 0 2.5rem; background:var(--bg-alt);
      position:relative; overflow:hidden;
    }
    .hero::before {
      content:""; position:absolute; inset:0;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140' viewBox='0 0 140 140'><g fill='none' stroke='%2316a34a' stroke-width='1.2' opacity='0.4'><path d='M35 12h22c0-7 10-7 10 0h22v22c7 0 7 10 0 10v22H67c0 7-10 7-10 0H35V44c-7 0-7-10 0-10V12z'/><path d='M95 82h22c0-7 10-7 10 0h22v22c7 0 7 10 0 10v22h-22c0 7-10 7-10 0H95v-22c-7 0-7-10 0-10V82z' opacity='0.7'/></g></svg>");
      background-size: 150px 150px;
      opacity: 0.16;
      pointer-events:none; z-index:0;
    }
    [data-theme="dark"] .hero::before { opacity: 0.08; }
    .hero-inner {
      display:grid; grid-template-columns:1.1fr 0.9fr; gap:2rem; align-items:center;
      position:relative; z-index:1;
    }
    @media (max-width:768px) {
      .hero-inner { grid-template-columns:1fr; }
      .nav-links { gap:0.5rem; }
      .nav-links span { display:none; }
    }
    .hero-top {
      display:flex; align-items:center; gap:1.25rem; margin-bottom:0.5rem; flex-wrap:wrap;
    }
    .avatar-circle {
      width:96px; height:96px; border-radius:50%;
      object-fit:cover; border:3px solid var(--primary);
      box-shadow:0 4px 14px var(--shadow);
      flex-shrink:0; background:#e5e7eb;
    }
    .hero h1 {
      font-size:2.4rem; color:#000; margin-bottom:0.5rem; font-weight:800;
    }
    [data-theme="dark"] .hero h1 { color:#fff; }
    .hero-sub { font-size:1.1rem; color:var(--text-light); margin-bottom:1rem; }
    .badge-list { display:flex; flex-wrap:wrap; gap:0.5rem; margin:1rem 0; }
    .badge {
      background:rgba(22,163,74,0.12); color:var(--primary-dark);
      padding:0.3rem 0.7rem; border-radius:99px; font-size:0.85rem; font-weight:500;
    }
    [data-theme="dark"] .badge { background:rgba(34,197,94,0.18); color:var(--primary-light); }
    .contact-row { display:flex; flex-wrap:wrap; gap:0.6rem; margin-top:1rem; }
    section { padding:2.5rem 0; }
    .section-title {
      font-size:1.6rem; margin-bottom:1.5rem; color:var(--primary-dark);
      border-left:4px solid var(--primary); padding-left:0.75rem;
    }
    .grid-3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1rem; }
    .card {
      background:var(--card-bg); border:1px solid var(--border); border-radius:12px;
      padding:1.25rem; transition:var(--transition);
    }
    .card:hover {
      transform:translateY(-4px); box-shadow:0 8px 20px var(--shadow);
      border-color:rgba(22,163,74,0.3);
    }
    .card h3 { color:var(--primary); margin-bottom:0.4rem; font-size:1.1rem; }
    .tabs-wrap { margin:1rem 0; }
    .tab-list { display:flex; gap:0.25rem; border-bottom:1px solid var(--border); margin-bottom:1rem; }
    .tab-btn {
      padding:0.7rem 1rem; background:transparent; border-bottom:3px solid transparent;
      border-radius:8px 8px 0 0; color:var(--text-light); font-weight:500;
    }
    .tab-btn[aria-selected="true"] { border-bottom-color:var(--primary); color:var(--primary); }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; animation:fadeIn 220ms ease; }
    @keyframes fadeIn { from {opacity:0; transform:translateY(6px);} to {opacity:1; transform:translateY(0);} }
    .timeline-item { margin-bottom:1.2rem; padding-bottom:1rem; border-bottom:1px dashed var(--border); }
    .timeline-item:last-child { border-bottom:none; }
    .timeline-head { display:flex; justify-content:space-between; flex-wrap:wrap; }
    .timeline-title { font-weight:600; color:var(--primary); }
    .timeline-date { color:var(--text-light); font-size:0.9rem; }
    .skill-row { margin-bottom:0.8rem; }
    .skill-label { display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:0.25rem; }
    .skill-bar { height:8px; background:#e5e7eb; border-radius:99px; overflow:hidden; }
    [data-theme="dark"] .skill-bar { background:#374151; }
    .skill-fill { height:100%; background:linear-gradient(90deg,var(--primary),var(--primary-light)); border-radius:99px; }
    .quote-card {

    }
    footer { text-align:center; padding:2rem; color:var(--text-light); font-size:0.9rem; border-top:1px solid var(--border); }
    .back-top {
      position:fixed; bottom:1.2rem; right:1.2rem; opacity:0; pointer-events:none;

      display:grid; place-items:center; transition:var(--transition);

    .back-top.visible { opacity:1; pointer-events:auto; }
    .puzzle-icon { display:inline-block; width:18px; height:18px; vertical-align:middle; margin-right:4px; }
    @media print {
      :root { --primary:#15803d; }

      .tab-panel { display:block !important; }
      .card { box-shadow:none; border:1px solid #ccc; }
      section { padding:0.6rem 0; page-break-inside:avoid; }
      .hero { background:#fff; padding:1rem 0; }
      .hero::before { display:none; }
      .nav-puzzle-slogan { display:none; }
      .hero h1 { color:#000 !important; }
    }
  </style>
</head>

});
function switchTab(activeBtn){
  tabBtns.forEach(b=>b.setAttribute('aria-selected','false'));
  activeBtn.setAttribute('aria-selected','true');
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(activeBtn.getAttribute('aria-controls')).classList.add('active');
}

    <h3>教育背景</h3>
    <p><strong>${resume.education.school}</strong>｜${resume.education.major}</p>
    <p>核心课程：${resume.education.courses}</p>
    <p>${resume.education.english}</p>
    <p>学习方向：${resume.education.direction}</p>
  </div>
  <div class="card">
    <h3>证书与奖项</h3>
    <p style="color:var(--text-light)">待补充英语、编程、竞赛、奖学金等证书</p>
  </div>`;

document.getElementById('selfIntro').textContent = resume.selfDesc;

const themeBtn = document.getElementById('themeBtn');
const htmlEl = document.documentElement;
const savedTheme = localStorage.getItem('cv-theme');
if(savedTheme==='dark') htmlEl.setAttribute('data-theme','dark');
themeBtn.onclick = ()=>{
  if(htmlEl.hasAttribute('data-theme')){
    htmlEl.removeAttribute('data-theme'); localStorage.setItem('cv-theme','light');
  } else {
    htmlEl.setAttribute('data-theme','dark'); localStorage.setItem('cv-theme','dark');
  }
};

document.getElementById('printBtn').onclick = ()=>window.print();

const backTopBtn = document.getElementById('backTop');
window.addEventListener('scroll',()=>{
  backTopBtn.classList.toggle('visible', window.scrollY>300);
});
backTopBtn.onclick = ()=>window.scrollTo({top:0,behavior:'smooth'});
</script>
</body>
</html>
